optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0004,
  weight_decay : 0.0005
}}
scheduler: {
  type: LambdaLR,
  use_warmup: False,
  kwargs: {
  decay_step: 20,
  lr_decay: 0.8,
  lowest_decay: 0.01  # min lr = lowest_decay * lr
}}
bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 20,
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}
dataset : {
  train : { _base_: cfgs/dataset_configs/MVP.yaml,
            others: {subset: 'train'}},
  val : {_base_: cfgs/dataset_configs/MVP.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/MVP.yaml,
            others: {subset: 'test'}}}
model : {
  NAME: MyNetMS,
  npoint_list: [2048,512,128],
  nsample_list: [16,16,8],
  seed_dims: [64,128,256],

  ## KP parameters
  num_kp: 256,
  feat_dim: 1024,
  shapegen_hidden_dim: 32,
  mlp_ratio: 1,
  sphere_number: 146,
  subnetworks: 1,
  shapegen_use_sa: True, # False, #
  use_fps: False, #True, #
  kp_merge_input: True,
  ## Decoder parameters
  use_sa: True,
  ratio_list: [2,2,8], # [2,4,4], # 256--256seed-->512--512seed--1024--x8-->8192
  scale_list: [1,0.5,0.25],
  l2_loss: 0
}
total_bs: 64
step_per_update : 1
max_epoch : 150
consider_metric: CDL1
