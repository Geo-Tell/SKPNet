optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0004,
  weight_decay : 0.0005
}}
scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 20,
  lr_decay: 0.8,
  lowest_decay: 0.01
}}
bnmscheduler: {
  type: Lambda,
  kwargs: {
  decay_step: 20,
  bn_decay: 0.5,
  bn_momentum: 0.9,
  lowest_decay: 0.01
}}
dataset : {
  train : { _base_: cfgs/dataset_configs/MVP.yaml,
            others: {subset: 'train'}},
  val : {_base_: cfgs/dataset_configs/ScanNet.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/ScanNet.yaml,
            others: {subset: 'test'}}}
model : {
  NAME: MyNetMS,
  npoint_list: [2048,512,256],
  nsample_list: [16,16,8],
  seed_dims: [64,64,128], #,[32,64,128], #
  out_dims:  [128,128,64], #[128,64,32], #

  ## KP parameters
  num_kp: 256,
  feat_dim: 1024,
  shapegen_hidden_dim: 32,
  mlp_ratio: 1,
  sphere_number: 258,
  subnetworks: 2,
  shapegen_use_sa: True, # False, #
  kp_merge_input: False,
  use_fps: False, #True, #
  ## Decoder parameters
  use_sa: True, #True,
  ratio_list: [2,2,8], # [2,4,4], # 256--256seed-->512--512seed--1024--x4-->81928
  scale_list: [0.4,0.4,0.2],
  l2_loss: 0
}
total_bs: 64
step_per_update : 1
max_epoch :  100
consider_metric: CDL1
